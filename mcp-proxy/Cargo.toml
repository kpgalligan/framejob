[package]
name = "framejob-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "framejob_mcp"
path = "src/lib.rs"

[[bin]]
name = "framejob-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
# The app's own transport (core/src/agent.rs), for the tests' stub servers.
tiny_http = "0.12"

[profile.release]
# No LTO (designs/adr/rust-build-settings.md).
incremental = true
