<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/reelcut-design-system-2b6440ca-3b4a-4f1b-a40b-66a71401af03/styles.css">
<script src="_ds/reelcut-design-system-2b6440ca-3b4a-4f1b-a40b-66a71401af03/_ds_bundle.js"></script>
</helmet>
<div style="height:28px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;border-top:1px solid var(--border-subtle);background:var(--surface-bar);cursor:pointer">
  <x-import component-from-global-scope="ReelcutDesignSystem_2b6440.Icon" name="{{ chevron }}" size="{{ 15 }}" color="var(--text-meta)" hint-size="15px,15px"></x-import>
  <span style="font:500 10px/1 var(--font-mono);letter-spacing:0.09em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap">{{ title }}</span>
  <sc-if value="{{ hasKeys }}" hint-placeholder-val="{{ false }}"><span style="font:500 9px/1 var(--font-mono);color:{{ ac }};white-space:nowrap">◆{{ keys }}</span></sc-if>
  <sc-if value="{{ held }}" hint-placeholder-val="{{ false }}"><span style="font:500 9px/1 var(--font-mono);color:var(--text-faint)">◇</span></sc-if>
  <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}"><span style="font:400 10px/1 var(--font-mono);color:var(--text-faint)">⊘</span></sc-if>
  <div style="flex:1;min-width:4px"></div>
  <span style="font:400 10px/1 var(--font-mono);color:{{ summaryColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">{{ summary }}</span>
  <sc-if value="{{ hasReset }}" hint-placeholder-val="{{ false }}">
    <x-import component-from-global-scope="ReelcutDesignSystem_2b6440.Button" size="sm" hint-size="auto,22px">{{ reset }}</x-import>
  </sc-if>
  <sc-if value="{{ noReset }}" hint-placeholder-val="{{ true }}"><div style="width:4px"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:304,&quot;height&quot;:28}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const ac = p.ac || '#E07BD8';
    const open = p.open === '1' || p.open === true;
    const tone = p.tone || (p.changed === '1' ? 'bright' : 'faint');
    return {
      ac, title: p.title || '', summary: p.summary || '', keys: p.keys || '',
      chevron: open ? 'expand_more' : 'chevron_right',
      hasKeys: !!p.keys, held: p.held === '1', locked: p.locked === '1',
      summaryColor: tone === 'keyed' ? ac : tone === 'bright' ? 'var(--text-body)' : 'var(--text-faint)',
      hasReset: !!p.reset, noReset: !p.reset, reset: p.reset || '',
    };
  }
}
</script>
</body>
</html>
