<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/design-system-2b6440ca-3b4a-4f1b-a40b-66a71401af03/styles.css">
<script src="_ds/design-system-2b6440ca-3b4a-4f1b-a40b-66a71401af03/_ds_bundle.js"></script>
</helmet>
<div style="position:relative;width:{{ W }};height:{{ H }}">
  <div style="position:absolute;inset:0;box-sizing:border-box;border-radius:2px;overflow:hidden;background:#3E5063;border:1px solid var(--clip-border);outline:{{ ring }};outline-offset:0">
    <div style="height:16px;background:var(--clip-strip);display:flex;align-items:center;gap:5px;padding:0 6px">
      <x-import component-from-global-scope="ReelcutDesignSystem_2b6440.Icon" name="movie" size="{{ 11 }}" color="var(--clip-icon)" hint-size="11px,11px"></x-import>
      <span style="font:600 10px/1 var(--font-sans);color:var(--clip-name);white-space:nowrap">{{ name }}</span>
    </div>
    <div style="position:relative;height:{{ laneH }};background:rgba(0,0,0,0.22)">
      <sc-for list="{{ bands }}" as="b" hint-placeholder-count="2">
        <sc-if value="{{ b.isDrag }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:0;bottom:0;left:{{ b.ghostL }};width:{{ b.w }};box-sizing:border-box;border:1px dashed {{ b.edge }}"></div></sc-if>
        <div style="position:absolute;top:0;bottom:0;left:{{ b.l }};width:{{ b.w }};box-sizing:border-box;background:{{ b.bg }};border-left:1px solid {{ b.edge }};border-right:1px solid {{ b.edge }};display:flex;align-items:center;gap:4px;padding:0 5px;overflow:hidden">
          <sc-if value="{{ b.showCurve }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 100 10" preserveAspectRatio="none" style="position:absolute;inset:2px 0;width:100%;height:calc(100% - 4px)"><path d="{{ b.curveD }}" fill="none" stroke="{{ b.curveColor }}" stroke-width="1.25" vector-effect="non-scaling-stroke"></path></svg></sc-if>
          <sc-if value="{{ b.showZoom }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="ReelcutDesignSystem_2b6440.Icon" name="zoom_in" size="{{ 11 }}" color="{{ b.text }}" hint-size="11px,11px" style="position:relative"></x-import></sc-if>
          <sc-if value="{{ b.showNum }}" hint-placeholder-val="{{ false }}"><span style="position:relative;font:600 9px/1 var(--font-mono);color:{{ b.text }}">{{ b.n }}</span></sc-if>
          <sc-if value="{{ b.showLabel }}" hint-placeholder-val="{{ false }}"><span style="position:relative;font:600 10px/1 var(--font-sans);color:{{ b.text }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.label }}</span></sc-if>
          <sc-if value="{{ b.grips }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:{{ b.gripC }}"></div>
            <div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:{{ b.gripC }}"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <div style="position:relative;flex:1;height:{{ bodyH }};background:repeating-linear-gradient(90deg,rgba(255,255,255,0.05) 0 17px,rgba(0,0,0,0.08) 17px 34px)">
      <sc-for list="{{ guides }}" as="g" hint-placeholder-count="0">
        <div style="position:absolute;top:0;bottom:0;left:{{ g.l }};width:{{ g.w }};box-sizing:border-box;background:{{ g.bg }};border-left:1px solid {{ g.edge }};border-right:1px solid {{ g.edge }}"></div>
      </sc-for>
      <div style="position:absolute;left:0;right:0;bottom:0;height:{{ audioH }};background:rgba(255,255,255,0.06);border-top:1px solid rgba(0,0,0,0.25)">
        <div style="position:absolute;left:0;right:0;top:40%;height:2px;background:rgba(255,255,255,0.32)"></div>
      </div>
    </div>
    <sc-if value="{{ selected }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--clip-grip)"></div>
      <div style="position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--clip-grip)"></div>
    </sc-if>
  </div>
  <sc-for list="{{ huds }}" as="h" hint-placeholder-count="0">
    <div style="position:absolute;top:-24px;left:{{ h.l }};height:20px;box-sizing:border-box;padding:0 6px;display:flex;align-items:center;gap:6px;background:var(--surface-popover);border:1px solid var(--border-popover);font:400 10px/1 var(--font-mono);color:var(--text-body);white-space:nowrap;z-index:3">{{ h.t }}<span style="color:var(--text-faint)">{{ h.d }}</span></div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:130}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const ac = p.ac || '#E07BD8';
    const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
    const size = p.size || 'M';
    const trackH = { S: 54, M: 84, L: 116 }[size];
    const laneH = { S: 5, M: 12, L: 18 }[size];
    const H = trackH - 6;
    const bodyH = H - 2 - 16 - laneH;
    const ink = p.ink || '#101010';
    const curves = { linear: 'M0,10 L100,0', inout: 'M0,10 C45,10 55,0 100,0', out: 'M0,10 C30,0 60,0 100,0', in: 'M0,10 C40,10 70,10 100,0' };
    const bands = (p.bands || []).map((b) => {
      const st = b.state || 'normal';
      const sel = st === 'selected' || st === 'drag';
      const hov = st === 'hover';
      return {
        l: b.l + 'px', w: b.w + 'px', ghostL: (b.ghostL ?? b.l) + 'px', isDrag: st === 'drag', n: b.n, label: b.label || '',
        bg: sel ? ac : hov ? rgba(ac, 0.62) : rgba(ac, 0.34),
        edge: sel ? ac : hov ? ac : rgba(ac, 0.75),
        text: sel ? ink : '#ffffff',
        showNum: size !== 'S',
        showLabel: size === 'L' || (size === 'M' && (sel || hov)),
        showCurve: size !== 'S' && (sel || size === 'L'),
        curveD: curves[b.curve || 'inout'], curveColor: sel ? rgba('#101010', 0.45) : 'rgba(255,255,255,0.35)',
        showZoom: !!b.zoom && size !== 'S',
        grips: hov || sel, gripC: sel ? rgba('#101010', 0.5) : 'rgba(255,255,255,0.8)',
      };
    });
    const guides = (p.bands || []).filter((b) => b.state === 'selected' || b.state === 'drag').map((b) => ({ l: b.l + 'px', w: b.w + 'px', bg: rgba(ac, 0.12), edge: rgba(ac, 0.55) }));
    const huds = (p.bands || []).filter((b) => b.hud).map((b) => ({ l: b.l + 'px', t: b.hud, d: b.hudDelta || '' }));
    return {
      W: (p.width || 600) + 'px', H: H + 'px', laneH: laneH + 'px', bodyH: bodyH + 'px', audioH: Math.round(bodyH * 0.38) + 'px',
      name: p.name || 'Intro demo', bands, guides, huds,
      selected: p.selected !== '0', ring: p.selected !== '0' ? '2px solid var(--playhead)' : 'none',
    };
  }
}
</script>
</body>
</html>
