[package]
name = "cursor_spike_reader"
version = "0.1.0"
edition = "2021"
publish = false

# Road map "creator-jobs" CU0b's scratch crate (CU-S4): the cursor file's reader
# prototype over a worst case. Not a product crate: its own workspace, so the
# core's never sees it. CU1a writes the real format from CU-S4's verdict.
[workspace]

[[bin]]
name = "cursor-spike-reader"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
